[workspace]
name = "deltagain-accumulation-curve"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11"
numpy = ">=1.26"
pyarrow = ">=15"
duckdb = ">=1.0"
matplotlib = ">=3.8"
plotly = ">=5.20"
r-base = ">=4.3"
r-ggplot2 = ">=3.5"
r-arrow = ">=15"
r-jsonlite = ">=1.8"
pytest = ">=8"

[tasks]
test = "pytest tests/ -v"
