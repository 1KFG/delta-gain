# Quarto project config: renders reports/*.qmd into docs/reports/ (kept
# separate from the hand-written Jekyll landing page at docs/index.md — see
# docs/_config.yml's header comment for why the two coexist without conflict).
#
# Render locally with:
#   module load quarto
#   cd reports && quarto render
#
# Reads pipeline outputs directly from ../results/ and ../lib/ at render
# time (those stay on /bigdata, gitignored) and emits only the small,
# publishable HTML/figures/tables into docs/reports/ (git-tracked).

project:
  type: website
  output-dir: ../docs/reports

website:
  title: "DeltaGain Reports"
  navbar:
    left:
      - href: index.qmd
        text: Overview

format:
  html:
    theme: cosmo
    toc: true
